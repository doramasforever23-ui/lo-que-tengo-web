<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Lo que tengo, lo que como</title><link rel="stylesheet" href="estilos.css"></head>
<body><div class="wrap">
  <h1 class="hero" style="font-size:2.4rem">Panel de administrador</h1>
  <div class="tabs" id="tabs"><button data-t="prod" class="on">🛒 Productos</button><button data-t="msg">✉️ Mensajes</button><button data-t="ped">📦 Pedidos</button></div>
  <section class="panel on" id="p-prod"><form class="card" id="form"><h3 id="ftit">Nuevo producto</h3>
    <div class="g2"><div><label>Nombre</label><input id="pn" required></div><div><label>Categoría</label><input id="pcat" value="Cocinar" required></div>
    <div><label>Precio ($)</label><input id="pp" type="number" step="0.01" min="0" required></div><div><label>Emoji</label><input id="pe" value="🍽️" maxlength="4"></div></div>
    <label>Descripción</label><input id="pd" required><label>URL o ruta de la foto (opcional, ej.: img/balanza.jpg)</label><input id="pi">
    <p><button class="btn">Guardar</button> <button type="button" class="btn sec" id="cancelar" hidden>Cancelar edición</button> <span id="msg" role="status"></span></p></form>
    <div class="card" style="margin-top:14px;overflow:auto"><table id="tabla"></table></div></section>
  <section class="panel" id="p-msg"><div id="mensajes"></div></section>
  <section class="panel" id="p-ped"><div id="pedidos"></div></section>
</div>
<script src="config.js"></script><script src="comun.js"></script>
<script>
if (localStorage.getItem("rol") !== "admin") location.href = "auth.html";
navbar("admin.html");
let PS = [], EDIT = null;
const vacio = (t) => `<div class="card mut">${t}</div>`;
async function productos() {
  PS = await api("GET", "/api/productos", null, false);
  $("tabla").innerHTML = `<tr><th></th><th>Nombre</th><th>Categoría</th><th>Precio</th><th></th></tr>` + PS.map((p) => `<tr><td>${esc(p.emoji)}</td><td>${esc(p.nombre)}</td><td>${esc(p.categoria)}</td><td>$${p.precio.toFixed(2)}</td>
    <td><button class="chip" data-e="${p.id}">Editar</button> <button class="chip" data-b="${p.id}">Borrar</button></td></tr>`).join("");
}
$("tabla").onclick = async (e) => { const d = e.target.dataset;
  if (d.e) { const p = PS.find((x) => x.id === d.e); EDIT = p.id; $("ftit").textContent = "Editando: " + p.nombre; $("cancelar").hidden = false;
    $("pn").value = p.nombre; $("pcat").value = p.categoria; $("pp").value = p.precio; $("pe").value = p.emoji; $("pd").value = p.descripcion; $("pi").value = p.imagen; scrollTo(0, 0); }
  if (d.b && confirm("¿Borrar este producto?")) { await api("DELETE", "/api/admin/productos/" + d.b); toast("Producto borrado"); productos(); } };
$("cancelar").onclick = () => { EDIT = null; $("form").reset(); $("ftit").textContent = "Nuevo producto"; $("cancelar").hidden = true; };
$("form").onsubmit = async (e) => { e.preventDefault();
  const cuerpo = { nombre: $("pn").value, categoria: $("pcat").value, precio: +$("pp").value, emoji: $("pe").value || "🍽️", descripcion: $("pd").value, imagen: $("pi").value };
  try { await api(EDIT ? "PUT" : "POST", "/api/admin/productos" + (EDIT ? "/" + EDIT : ""), cuerpo); toast("Guardado ✓"); $("cancelar").click(); productos(); }
  catch (x) { $("msg").className = "err"; $("msg").textContent = x.message; } };
async function mensajes() { const m = await api("GET", "/api/admin/mensajes");
  $("mensajes").innerHTML = m.map((x) => `<div class="card" style="margin-bottom:10px"><b>${esc(x.nombre)}</b> · <a href="mailto:${esc(x.correo)}">${esc(x.correo)}</a> <span class="mut">· ${esc(x.fecha)}</span><p>${esc(x.mensaje)}</p></div>`).join("") || vacio("Aún no hay mensajes."); }
async function pedidos() { const m = await api("GET", "/api/admin/pedidos");
  $("pedidos").innerHTML = m.map((x) => `<div class="card" style="margin-bottom:10px"><b>${esc(x.nombre)}</b> · ${esc(x.contacto)} <span class="mut">· ${esc(x.fecha)}</span>
    <ul>${x.items.map((i) => `<li>${i.cantidad} × ${esc(i.nombre)}</li>`).join("")}</ul><b>Total: $${x.total.toFixed(2)}</b>${x.nota ? `<p class="mut">Nota: ${esc(x.nota)}</p>` : ""}</div>`).join("") || vacio("Aún no hay pedidos."); }
$("tabs").onclick = (e) => { const t = e.target.dataset.t; if (!t) return;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("on", p.id === "p-" + t));
  ({ prod: productos, msg: mensajes, ped: pedidos })[t]().catch((x) => toast(x.message)); };
productos().catch((x) => toast(x.message));
</script></body></html>
